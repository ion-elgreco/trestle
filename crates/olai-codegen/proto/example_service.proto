syntax = "proto3";
package example.catalog.v1;

import "example_models.proto";
import "google/api/annotations.proto";
import "google/api/resource.proto";
import "olai/trestle/v1/annotations.proto";

option (google.api.resource_definition) = {
  type: "example.io/Catalog"
  pattern: "catalogs/{catalog}"
  plural: "catalogs"
  singular: "catalog"
};

service CatalogService {
  // A create answers 201.
  rpc CreateCatalog(CreateCatalogRequest) returns (Catalog) {
    option (google.api.http) = {
      post: "/catalogs"
      body: "*"
    };
    option (olai.trestle.v1.response_status) = 201;
  }
  rpc GetCatalog(GetCatalogRequest) returns (Catalog) {
    option (google.api.http) = {get: "/catalogs/{name}"};
  }
  rpc ListCatalogs(ListCatalogsRequest) returns (ListCatalogsResponse) {
    option (google.api.http) = {get: "/catalogs"};
  }
  rpc UpdateCatalog(UpdateCatalogRequest) returns (Catalog) {
    option (google.api.http) = {
      patch: "/catalogs/{name}"
      body: "*"
    };
  }
  rpc DeleteCatalog(DeleteCatalogRequest) returns (DeleteCatalogResponse) {
    option (google.api.http) = {delete: "/catalogs/{name}"};
  }

  // Custom POST RPC without path params — covers `RequestType::Custom(Post)`
  // dispatched as a collection method (the shape used by factory-style
  // RPCs like `GenerateTemporary*Credentials`).
  rpc GenerateCatalogToken(GenerateCatalogTokenRequest) returns (CatalogToken) {
    option (google.api.http) = {
      post: "/catalog-tokens"
      body: "*"
    };
  }

  // Resource-targeted custom GET (path param, not a collection method) — exercises surfacing a
  // custom read on the scoped client (`catalog.get_catalog_status()`) instead of leaving its
  // generated builder orphaned.
  rpc GetCatalogStatus(GetCatalogStatusRequest) returns (CatalogStatus) {
    option (google.api.http) = {get: "/catalogs/{name}/status"};
  }

  // Stream the events of a catalog: over REST an NDJSON answer, one line per event, with the
  // version of the catalog in the `Catalog-Version` header.
  rpc StreamCatalogEvents(StreamCatalogEventsRequest) returns (stream CatalogEvent) {
    option (google.api.http) = {get: "/catalogs/{name}/events"};
  }

  // Read the export of a catalog: over REST the raw bytes of the answer, chunk by chunk, with
  // the status and the headers from the first chunk.
  rpc DownloadCatalogExport(DownloadCatalogExportRequest) returns (stream CatalogExportChunk) {
    option (google.api.http) = {get: "/catalogs/{name}/export"};
  }

  // Write the import of a catalog: over REST the raw request body, chunk by chunk.
  rpc UploadCatalogImport(stream UploadCatalogImportRequest) returns (DeleteCatalogResponse) {
    option (google.api.http) = {
      put: "/catalogs/{name}/import"
      body: "contents"
    };
  }
}

message CreateCatalogRequest {
  Catalog catalog = 1;
}

message GetCatalogRequest {
  string name = 1;
}

message ListCatalogsRequest {
  int32 max_results = 1;
  string page_token = 2;
}

message ListCatalogsResponse {
  repeated Catalog catalogs = 1;
  string next_page_token = 2;
}

message UpdateCatalogRequest {
  string name = 1;
  Catalog catalog = 2;
}

message DeleteCatalogRequest {
  string name = 1;
}

message DeleteCatalogResponse {}

message GenerateCatalogTokenRequest {
  string catalog_id = 1;
}

message CatalogToken {
  string token = 1;
}

message GetCatalogStatusRequest {
  string name = 1;
  // The entity tag of the status the caller has, in the `If-None-Match` header.
  optional string if_none_match = 2 [(olai.trestle.v1.request_header) = "If-None-Match"];
}

message CatalogStatus {
  string state = 1;
  // The entity tag, in the `ETag` header.
  string etag = 2 [(olai.trestle.v1.response_header) = "ETag"];
}

message StreamCatalogEventsRequest {
  string name = 1;
}

// An event of a catalog.
message CatalogEvent {
  string kind = 1;
  // The version of the catalog, in the `Catalog-Version` header of the answer.
  int64 version = 2 [(olai.trestle.v1.response_header) = "Catalog-Version"];
}

message DownloadCatalogExportRequest {
  string name = 1;
  // The bytes to read, in the `Range` header.
  optional string range = 2 [(olai.trestle.v1.request_header) = "Range"];
}

// A chunk of the export of a catalog.
message CatalogExportChunk {
  // The bytes of the chunk.
  bytes contents = 1 [(olai.trestle.v1.raw_body) = true];
  // The status of the answer: 206 for a range.
  optional int32 status = 2 [(olai.trestle.v1.http_status) = true];
  // The size of the export, in the `Content-Length` header.
  optional int64 size = 3 [(olai.trestle.v1.response_header) = "Content-Length"];
}

message UploadCatalogImportRequest {
  string name = 1;
  // The bytes of a chunk of the import.
  bytes contents = 2 [(olai.trestle.v1.raw_body) = true];
}
