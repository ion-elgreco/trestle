syntax = "proto3";
package demo.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/struct.proto";
import "olai/trestle/v1/annotations.proto";

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
}

// The error codes of the demo server.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  WIDGET_NOT_FOUND = 1;
  INVALID_ARGUMENT = 2;
}

// A widget.
message Widget {
  option (google.api.resource) = {
    type: "demo.io/Widget"
    pattern: "widgets/{widget}"
    plural: "widgets"
    singular: "widget"
  };

  // The name of the widget.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The color of the widget.
  Color color = 2;
  // The creation time, in epoch milliseconds.
  optional int64 created_at = 3;
  // The size, in bytes.
  int64 size_bytes = 4;
  // Key-value properties.
  map<string, string> properties = 5;
  // A name to show.
  string display_name = 6;
  // A field with an explicit JSON name, kept as is.
  string metadata_location = 7 [json_name = "metadata-location"];
  // Free-form attributes: any JSON object.
  google.protobuf.Struct attributes = 8;
  // A free-form value: any JSON value.
  google.protobuf.Value extra = 9;
  // Free-form values.
  repeated google.protobuf.Value notes = 10;
  // Rows of free-form values, by table.
  map<string, google.protobuf.ListValue> rows = 11;
}

message ListWidgetsRequest {
  // The maximum number of widgets to return.
  optional int32 max_results = 1 [(google.api.field_behavior) = OPTIONAL];
  // The page to return.
  optional string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
  // Only the widgets of this color.
  optional Color color = 3 [(google.api.field_behavior) = OPTIONAL];
  // Index of the first widget, from 1. Its query key is its explicit JSON name.
  optional int32 first = 4 [json_name = "startIndex"];
}

// A label of a widget. Only requests take it, so only it gets a Python constructor.
message Label {
  // The key.
  string key = 1;
  // The value.
  string value = 2;
}

message ListWidgetsResponse {
  repeated Widget widgets = 1;
  optional string next_page_token = 2;
}

message CreateWidgetRequest {
  // The name of the widget.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // The creation time, in epoch milliseconds.
  optional int64 created_at = 2 [(google.api.field_behavior) = OPTIONAL];
  // A name to show.
  optional string display_name = 3 [(google.api.field_behavior) = OPTIONAL];
  // Labels to set.
  repeated Label labels = 4 [(google.api.field_behavior) = OPTIONAL];
  // Free-form attributes: any JSON object.
  google.protobuf.Struct attributes = 5 [(google.api.field_behavior) = OPTIONAL];
}

message GetWidgetRequest {
  // The name of the widget.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteWidgetRequest {
  // The name of the widget.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message Empty {}

message ExchangeTokenRequest {
  string grant_type = 1 [(google.api.field_behavior) = REQUIRED];
  string subject_token = 2 [(google.api.field_behavior) = REQUIRED];
}

message ExchangeTokenResponse {
  string access_token = 1;
  int64 expires_in = 2;
}

// Manage widgets.
service WidgetService {
  // List widgets.
  rpc ListWidgets(ListWidgetsRequest) returns (ListWidgetsResponse) {
    option (google.api.http) = {get: "/api/v1/widgets"};
  }

  // Create a widget.
  rpc CreateWidget(CreateWidgetRequest) returns (Widget) {
    option (google.api.http) = {
      post: "/api/v1/widgets"
      body: "*"
    };
  }

  // Get a widget.
  rpc GetWidget(GetWidgetRequest) returns (Widget) {
    option (google.api.http) = {get: "/api/v1/widgets/{name}"};
  }

  // Delete a widget.
  rpc DeleteWidget(DeleteWidgetRequest) returns (Empty) {
    option (google.api.http) = {delete: "/api/v1/widgets/{name}"};
  }
}

message WidgetExistsRequest {
  // The name of the widget.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message SearchWidgetsRequest {
  // The start of the names to find.
  string prefix = 1 [(google.api.field_behavior) = REQUIRED];
}

message StreamWidgetsRequest {
  // Only the widgets whose names start with this.
  optional string prefix = 1;
}

// One line of a widget stream.
message WidgetLine {
  // The name of the widget.
  string name = 1;
  // When the widget was created, in epoch milliseconds.
  int64 created_at = 2;
}

message WidgetVersionRequest {
  // The name of the widget.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// The version of a widget, partly from the response headers.
message WidgetVersion {
  // The name of the widget, from the body.
  string name = 1;
  // The version, from the `Widget-Version` header.
  int64 version = 2 [(olai.trestle.v1.response_header) = "Widget-Version"];
  // The entity tag, from the `ETag` header.
  optional string etag = 3 [(olai.trestle.v1.response_header) = "ETag"];
}

// Requests that `google.api.http` writes in less common ways.
service ProbeService {
  // Whether a widget exists: a `HEAD` request, which fails for a missing widget.
  rpc WidgetExists(WidgetExistsRequest) returns (Empty) {
    option (google.api.http) = {
      custom: {
        kind: "HEAD"
        path: "/api/v1/widgets/{name}"
      }
    };
  }

  // Find widgets: a `GET` with a JSON body.
  rpc SearchWidgets(SearchWidgetsRequest) returns (ListWidgetsResponse) {
    option (google.api.http) = {
      get: "/api/v1/search"
      body: "*"
    };
  }

  // Stream widgets: an NDJSON answer, one line per widget.
  rpc StreamWidgets(StreamWidgetsRequest) returns (stream WidgetLine) {
    option (google.api.http) = {get: "/api/v1/widget-lines"};
  }

  // The version of a widget: fields from the response headers.
  rpc WidgetVersion(WidgetVersionRequest) returns (.demo.v1.WidgetVersion) {
    option (google.api.http) = {get: "/api/v1/widgets/{name}/version"};
  }
}

// Exchange tokens.
service TokenService {
  // Exchange a token for an access token.
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse) {
    option (google.api.http) = {
      post: "/auth/tokens"
      body: "*"
    };
  }
}
