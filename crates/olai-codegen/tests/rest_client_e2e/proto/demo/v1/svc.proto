syntax = "proto3";
package demo.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
}

// The error codes of the demo server.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  WIDGET_NOT_FOUND = 1;
  INVALID_ARGUMENT = 2;
}

// A widget.
message Widget {
  option (google.api.resource) = {
    type: "demo.io/Widget"
    pattern: "widgets/{widget}"
    plural: "widgets"
    singular: "widget"
  };

  // The name of the widget.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The color of the widget.
  Color color = 2;
  // The creation time, in epoch milliseconds.
  optional int64 created_at = 3;
  // The size, in bytes.
  int64 size_bytes = 4;
  // Key-value properties.
  map<string, string> properties = 5;
  // A name to show.
  string display_name = 6;
  // A field with an explicit JSON name, kept as is.
  string metadata_location = 7 [json_name = "metadata-location"];
}

message ListWidgetsRequest {
  // The maximum number of widgets to return.
  optional int32 max_results = 1 [(google.api.field_behavior) = OPTIONAL];
  // The page to return.
  optional string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
  // Only the widgets of this color.
  optional Color color = 3 [(google.api.field_behavior) = OPTIONAL];
  // Index of the first widget, from 1. Its query key is its explicit JSON name.
  optional int32 first = 4 [json_name = "startIndex"];
}

// A label of a widget. Only requests take it, so only it gets a Python constructor.
message Label {
  // The key.
  string key = 1;
  // The value.
  string value = 2;
}

message ListWidgetsResponse {
  repeated Widget widgets = 1;
  optional string next_page_token = 2;
}

message CreateWidgetRequest {
  // The name of the widget.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // The creation time, in epoch milliseconds.
  optional int64 created_at = 2 [(google.api.field_behavior) = OPTIONAL];
  // A name to show.
  optional string display_name = 3 [(google.api.field_behavior) = OPTIONAL];
  // Labels to set.
  repeated Label labels = 4 [(google.api.field_behavior) = OPTIONAL];
}

message GetWidgetRequest {
  // The name of the widget.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteWidgetRequest {
  // The name of the widget.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message Empty {}

message ExchangeTokenRequest {
  string grant_type = 1 [(google.api.field_behavior) = REQUIRED];
  string subject_token = 2 [(google.api.field_behavior) = REQUIRED];
}

message ExchangeTokenResponse {
  string access_token = 1;
  int64 expires_in = 2;
}

// Manage widgets.
service WidgetService {
  // List widgets.
  rpc ListWidgets(ListWidgetsRequest) returns (ListWidgetsResponse) {
    option (google.api.http) = {get: "/api/v1/widgets"};
  }

  // Create a widget.
  rpc CreateWidget(CreateWidgetRequest) returns (Widget) {
    option (google.api.http) = {
      post: "/api/v1/widgets"
      body: "*"
    };
  }

  // Get a widget.
  rpc GetWidget(GetWidgetRequest) returns (Widget) {
    option (google.api.http) = {get: "/api/v1/widgets/{name}"};
  }

  // Delete a widget.
  rpc DeleteWidget(DeleteWidgetRequest) returns (Empty) {
    option (google.api.http) = {delete: "/api/v1/widgets/{name}"};
  }
}

// Exchange tokens.
service TokenService {
  // Exchange a token for an access token.
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse) {
    option (google.api.http) = {
      post: "/auth/tokens"
      body: "*"
    };
  }
}
