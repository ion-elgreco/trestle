# Opt-in end-to-end test of the generated REST client with the plain reqwest transport, the
# generated error module and the buffa JSON rewrites (snake_case names, int64 as numbers),
# against a local axum server.
#
# Excluded from the workspace (see the root Cargo.toml `exclude` list), like buffa_e2e. Run it
# explicitly:
#
#     cargo test --manifest-path crates/olai-codegen/tests/rest_client_e2e/Cargo.toml
#
# Requires `protoc` on PATH: build.rs compiles the proto with it and buffa-build invokes it.
[workspace]
members = ["py"]

[package]
name = "rest-client-e2e"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# The PyO3 wrappers of the models, used by the `py` crate.
python = ["dep:pyo3", "dep:pyo3-stub-gen"]

[dependencies]
buffa = { version = "0.7", features = ["json"] }
buffa-types = { version = "0.7", features = ["json"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
pyo3 = { version = "0.28", optional = true }
pyo3-stub-gen = { version = "0.23", default-features = false, optional = true }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[build-dependencies]
olai-codegen = { path = "../../" }

buffa-build = "0.7"
protobuf = "3"

[package.metadata.cargo-machete]
# Exercised only through the build-time generated models and client.
ignored = ["buffa-types", "futures", "serde", "pyo3", "pyo3-stub-gen"]
